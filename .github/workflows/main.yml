name: Check Circulars

on:
  schedule:
    - cron: '0 */2 * * *' # Runs every 2 hours
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write # <--- CRITICAL: Allows saving the history file

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-generativeai

      - name: Run Monitor Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monitor_ai.py

      # --- THIS STEP STOPS THE REPETITION ---
      - name: Save History
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add history.txt
          # Only commit if the file actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update job history" && git push)
